name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  blog-pointer:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block changes to the blog-posts pointer
        run: scripts/check-blog-pointer.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # content/blog is the public blog-posts repo; the build renders it.
          submodules: true

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Lint (zero warnings gate)
        run: vp lint --max-warnings=0

      - name: Build
        run: vp build

      - name: Run tests with coverage
        run: vp test run --coverage

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vitest.config.ts

      - name: Mutation testing (incremental)
        if: github.event_name == 'pull_request'
        run: vp exec stryker run --incremental
