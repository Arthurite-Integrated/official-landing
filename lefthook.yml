pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx}"
      run: bun lint {staged_files}
      stage_fixed: true
    format:
      glob: "*.{js,ts,jsx,tsx,json,md}"
      run: bun format {staged_files}
      stage_fixed: true
    test:
      glob: "*.{js,ts,jsx,tsx}"
      run: bunx vitest related {staged_files} --run --reporter=verbose --bail=1
    stryker:
      glob: "*.{ts,tsx}"
      run: bun run stryker:incremental
    react-doctor:
      glob: "*.{jsx,tsx}"
      run: bunx -y react-doctor@latest . --diff
